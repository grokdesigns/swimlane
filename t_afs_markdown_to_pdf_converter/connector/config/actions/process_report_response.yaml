schema: action/1
title: Process Report Response
name: process_report_response
description: Accept GenAI Response and Convert to PDF
inputs:
  type: object
  properties:
    markdown_text:
      type: string
      title: Markdown Text
      description: The Markdown-formatted text to convert to PDF
    document_title:
      type: string
      title: Document Title
      description: Title to display in the PDF document header
      default: Security Report
    include_timestamp:
      type: boolean
      title: Include Timestamp
      description: Add generation timestamp to the document header
      default: true
  required:
    - markdown_text
output:
  examples:
    - success: true
      message: Successfully converted 2303 characters to PDF (32802 bytes)
      pdf_content: >-
        
      html_content: >-
        PCFET0NUWVBFIGh0bWw+PGh0bWw+PGhlYWQ+PHRpdGxlPlJlcG9ydDwvdGl0bGU+PC9oZWFkPjxib2R5PjxoMT5UZXN0IFJlcG9ydDwvaDE+PC9ib2R5PjwvaHRtbD4=
  type: object
  properties:
    success:
      title: Success
      examples:
        - true
      type: boolean
    message:
      title: Message
      examples:
        - Successfully converted 2303 characters to PDF (32802 bytes)
      type: string
    pdf_content:
      title: PDF Content
      examples:
        - >-
          
      type: string
    html_content:
      title: HTML Content
      description: Base64-encoded HTML content of the generated document
      examples:
        - >-
          PCFET0NUWVBFIGh0bWw+PGh0bWw+PGhlYWQ+PHRpdGxlPlJlcG9ydDwvdGl0bGU+PC9oZWFkPjxib2R5PjxoMT5UZXN0IFJlcG9ydDwvaDE+PC9ib2R5PjwvaHRtbD4=
      type: string
  required: []
  additionalProperties: true
meta:
  outputType: json
